<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan Desk -- Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/static/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="wordmark">LOAN<span>DESK</span></div>
      <h1>Sign in</h1>
      {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
      <form method="post" action="/dashboard/login">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="primary">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
